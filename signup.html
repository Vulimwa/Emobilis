<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div id="main">
      <div id="join">
        <h3>Come Join us!</h3>
        <p>
          We are so excited to have you here. If you haven't already, create an
          account to get access to exclusive offers, rewards and discounts
        </p>
        <button>Already have an account? Signin.</button>
      </div>
      <div id="sign">
        <form action="">
          <legend>Signup</legend>
          <input type="text" id="fullname" placeholder="Full Name" required />
          <br />
          <input
            type="email"
            id="email"
            placeholder="Email:eg example@gmail.com"
            required
          />
          <br />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <br />
          <input
            type="password"
            id="password"
            placeholder="Confirm Password"
            required
          />
          <br />
          <button type="submit">Signup</button>
          <p>or signup with</p>
          <div id="signicons">
            <div id="icons">
              <img src="assets/facebook.png" alt="facebook" srcset="" />
            </div>
            <div id="icons">
              <img src="assets/google.png" alt="google" srcset="" />
            </div>
            <div id="icons">
              <img src="assets/linkedin.png" alt="google" srcset="" />
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
